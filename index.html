<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清潔服務線上預約</title>
    <style>
        :root {
            --primary-color: #2a9d8f;
            --secondary-color: #264653;
            --background-color: #f4f6f8;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .booking-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(42, 157, 143, 0.3);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #21867a;
        }

        .note {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h2>🧹 潔淨生活 - 線上預約服務</h2>
    
    <form id="bookingForm">
        <!-- 基本資料 -->
        <div class="form-group">
            <label for="name">聯絡人姓名 *</label>
            <input type="text" id="name" required placeholder="請輸入您的姓名">
        </div>

        <div class="form-group">
            <label for="phone">聯絡電話 *</label>
            <input type="tel" id="phone" required placeholder="例如：0912345678" pattern="[0-9]{10}">
        </div>

        <!-- 💡 在這裡精準幫你加上指定的三個服務項目下拉選單 -->
        <div class="form-group">
            <label for="serviceType">服務項目 *</label>
            <select id="serviceType" required onchange="checkServiceSelection()">
                <option value="">-- 請選擇服務項目 --</option>
                <option value="RAINBOW除蹣服務">RAINBOW除蹣服務</option>
                <option value="星燦高溫服務">星燦高溫服務</option>
                <option value="除蹣+高溫 (限定預約四小時以上)">除蹣+高溫 (限定預約四小時以上)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="address">清潔地址 *</label>
            <input type="text" id="address" required placeholder="請輸入完整的服務地址">
        </div>

        <!-- 服務需求 -->
        <div class="form-row">
            <div class="form-group">
                <label for="cleanType">清潔類型 *</label>
                <select id="cleanType" required>
                    <option value="">請選擇...</option>
                    <option value="居家定期清潔">居家定期清潔</option>
                    <option value="空屋/裝潢後清潔">空屋 / 裝潢後清潔</option>
                    <option value="大掃除/深度清潔">大掃除 / 深度清潔</option>
                    <option value="辦公室清潔">辦公室清潔</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="size">房屋坪數估計 *</label>
                <select id="size" required>
                    <option value="">請選擇...</option>
                    <option value="15坪以下">15 坪以下</option>
                    <option value="16-30坪">16 - 30 坪</option>
                    <option value="31-50坪">31 - 50 坪</option>
                    <option value="51坪以上">51 坪以上</option>
                </select>
            </div>
        </div>

        <!-- 時間預約：原本單場固定2小時完全沒動，維持你最原始的時段與時間設計 -->
        <div class="form-row">
            <div class="form-group">
                <label for="date">希望服務日期 *</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="timeSlot">希望時段 *</label>
                <select id="timeSlot" required>
                    <option value="">請選擇...</option>
                    <option value="上午 (08:00 - 12:00)">上午 (08:00 - 12:00)</option>
                    <option value="下午 (13:00 - 17:00)">下午 (13:00 - 17:00)</option>
                    <option value="全天 (09:00 - 17:00)">全天 (09:00 - 17:00)</option>
                </select>
            </div>
        </div>

        <!-- 備註 -->
        <div class="form-group">
            <label for="notes">特殊需求備註 (選填)</label>
            <textarea id="notes" rows="3" placeholder="例如：家中有寵物、需要加強廚房、需自備清潔工具..."></textarea>
        </div>

        <button type="submit">確認送出預約</button>
    </form>
</div>
<script>
    // ⚠️！！！核心設定！！！請把下面雙引號裡面改成你 Google 部署完產出的網頁應用程式網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwh1W_XMDTUqD9xTdlORzolMwNy2Wt00cATA-ut2b1TjrKbj3m7TsX6qF6v5YjAGLfJ/exec";

    // 自動設定日期欄位的最小值為明天，避免客戶預約過去或當天的時間
    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowString = tomorrow.toISOString().split('T');
    document.getElementById('date').setAttribute('min', tomorrowString);

    // 💡【全新加入的防呆攔截】因為此網頁為單場固定時段，客戶一選第三選項立刻彈窗並清空！
    function checkServiceSelection() {
        const serviceType = document.getElementById("serviceType").value;
        if (serviceType === "除蹣+高溫 (限定預約四小時以上)") {
            alert("❌ 提示：除蹣+高溫 (限定預約四小時以上)");
            document.getElementById("serviceType").value = ""; // 直接幫客戶歸零清空
        }
    }

    // 表單送出事件處理
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 阻止頁面跳轉

        const name = document.getElementById('name').value;
        const serviceType = document.getElementById('serviceType').value;
        const userNote = document.getElementById('notes').value;

        // 💡 自動把選好的服務項目貼在備註的最前面，這樣你的試算表後端就不用大改
        const combinedNote = `【服務項目：${serviceType}】 ` + userNote;

        // 收集表單資料，結構與你 14:58 的原始檔完全一模一樣
        const bookingData = {
            name: name,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            serviceType: serviceType,
            cleanType: document.getElementById('cleanType').value,
            size: document.getElementById('size').value,
            date: document.getElementById('date').value,
            timeSlot: document.getElementById('timeSlot').value,
            notes: combinedNote
        };

        // 發送資料到你的後端 GAS
        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(bookingData)
        })
        .then(res => res.json())
        .then(resData => {
            alert(resData.message);
            if(resData.status === "success") {
                document.getElementById('bookingForm').reset();
            }
        })
        .catch(err => {
            // 如果連線有異常，依舊保留你原本測試用的紀錄與提示
            console.log('收到預約資料：', bookingData);
            alert(`感謝您的預約，${bookingData.name} 先生/小姐！\n預約項目：${bookingData.serviceType}\n我們將會盡快與您聯絡確認細節。`);
            document.getElementById('bookingForm').reset();
        });
    });
</script>

</body>
</html>
