<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 藍寶星空清潔預約 🌟</title>
    <style>
        :root { --primary: #0077b6; --secondary: #00b4d8; --bg: #f8f9fa; --danger: #e63946; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg); padding: 15px; display: flex; justify-content: center; }
        .booking-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 480px; width: 100%; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab-btn { padding: 8px 16px; border: 1px solid #ccc; background: #fff; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .tab-btn.active.book-mode { background: var(--primary); color: white; border-color: var(--primary); }
        .tab-btn.active.cancel-mode { background: var(--danger); color: white; border-color: var(--danger); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; font-family: inherit; }
        .time-range { display: flex; gap: 10px; align-items: center; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
        .btn-submit:hover { background: var(--secondary); }
        .btn-submit.btn-cancel-mode { background: var(--danger); }
        .btn-submit.btn-cancel-mode:hover { background: #ff4d6d; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        .loading-text { color: #888; font-size: 14px; font-style: italic; }
        .time-hint { color: var(--danger); font-size: 14px; font-weight: normal; display: block; margin-top: 4px; }
        .staff-hint { color: #0077b6; font-size: 14px; font-weight: normal; display: block; margin-top: 6px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="booking-card">
    <h2 id="mainTitle">✨ 藍寶星空清潔預約 ✨</h2>
    
    <div class="tab-container">
        <button type="button" id="tabBook" class="tab-btn active book-mode" onclick="switchMode('book')">線上預約</button>
        <button type="button" id="tabCancel" class="tab-btn cancel-mode" onclick="switchMode('cancel')">取消預約</button>
    </div>

    <form id="orderForm">
        <div class="form-group">
            <label>👤 客戶姓名 (需與系統登記一致) *</label>
            <input type="text" id="clientName" required placeholder="請輸入您登記的完整姓名">
        </div>

        <div class="form-group">
            <label>📱 聯絡電話 (填寫 10 位手機號碼) *</label>
            <!-- 💡 限制必須為 09 開頭且剛好 10 碼的數字 -->
            <input type="tel" id="clientPhone" required pattern="09\d{8}" placeholder="例如：0912345678">
        </div>
        
        <div id="geoFields">
            <div class="form-group">
                <label>📍 服務縣市 *</label>
                <select id="clientCity">
                    <option value="">-- 請選擇縣市 --</option>
                    <option value="基隆">基隆</option><option value="台北市">台北市</option><option value="新北市">新北市</option>
                    <option value="桃園">桃園</option><option value="新竹">新竹</option><option value="苗栗">苗栗</option>
                    <option value="台中">台中</option><option value="彰化">彰化</option><option value="南投">南投</option>
                    <option value="雲林">雲林</option><option value="嘉義">嘉義</option><option value="台南">台南</option>
                    <option value="高雄">高雄</option><option value="屏東">屏東</option>
                </select>
            </div>

            <div class="form-group">
                <label>區/鄉鎮/細部地址 *</label>
                <input type="text" id="clientDistrict" placeholder="例如：板橋區文化路一段XX號">
            </div>
        </div>

        <div class="form-group">
            <label id="dateLabel">📅 預約日期 *</label>
            <input type="date" id="bookingDate" required>
        </div>

        <div class="form-group">
            <label id="timeLabel">🕒 服務時間 (單場2小時，最後進門20:00) *</label>
            <span class="time-hint">⚠️ 提示：服務時間固定以 00分 或 30分 開課</span>
            <div class="time-range" style="margin-top: 8px;">
                <select id="startTime" required>
                    <option value="">-- 開始時間 --</option>
                    <option value="10:00">10:00</option><option value="10:30">10:30</option>
                    <option value="11:00">11:00</option><option value="11:30">11:30</option>
                    <option value="12:00">12:00</option><option value="12:30">12:30</option>
                    <option value="13:00">13:00</option><option value="13:30">13:30</option>
                    <option value="14:00">14:00</option><option value="14:30">14:30</option>
                    <option value="15:00">15:00</option><option value="15:30">15:30</option>
                    <option value="16:00">16:00</option><option value="16:30">16:30</option>
                    <option value="17:00">17:00</option><option value="17:30">17:30</option>
                    <option value="18:00">18:00</option><option value="18:30">18:30</option>
                    <option value="19:00">19:00</option><option value="19:30">19:30</option>
                    <option value="20:00">20:00</option>
                </select>
                <span id="timeToSpan">至</span>
                <select id="endTime" required>
                    <option value="">-- 結束時間 --</option>
                    <option value="12:00">12:00</option><option value="12:30">12:30</option>
                    <option value="13:00">13:00</option><option value="13:30">13:30</option>
                    <option value="14:00">14:00</option><option value="14:30">14:30</option>
                    <option value="15:00">15:00</option><option value="15:30">15:30</option>
                    <option value="16:00">16:00</option><option value="16:30">16:30</option>
                    <option value="17:00">17:00</option><option value="17:30">17:30</option>
                    <option value="18:00">18:00</option><option value="18:30">18:30</option>
                    <option value="19:00">19:00</option><option value="19:30">19:30</option>
                    <option value="20:00">20:00</option><option value="20:30">20:30</option>
                    <option value="21:00">21:00</option><option value="21:30">21:30</option>
                    <option value="22:00">22:00</option>
                </select>
            </div>
        </div>

        <div id="staffFields">
            <div class="form-group">
                <label>🙋‍♂️ 指定服務人員 * <span id="loadingStaff" class="loading-text" style="display:none;">(正在讀取當日排班名單...)</span></label>
                <select id="staffName">
                    <option value="">-- 請先選擇預約日期 --</option>
                </select>
                <!-- 💡 建議 2 的優雅小包裝小提示 -->
                <span class="staff-hint" id="unassignedHint" style="display:none;">💡 提示：選擇【不指定】者，若最終派單需跨縣市調度，公司將於電話核對時告知並另收 50 元車馬費。</span>
            </div>

            <div class="form-group">
                <label>📝 特殊需求與備註 (選填)</label>
                <textarea id="note" rows="3" placeholder="若您是幫家人預約，請在此留下家人的【姓名】與【電話】。若有其他清潔需求也請一併備註。"></textarea>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit" disabled>請填妥資料</button>
    </form>
</div>
<script>
    // ⚠️ 請把引號內改成您在 Google 複製的那一長串網址！
    var gasUrl = "https://script.google.com/macros/s/AKfycbwh1W_XMDTUqD9xTdlORzolMwNy2Wt00cATA-ut2b1TjrKbj3m7TsX6qF6v5YjAGLfJ/exec"; 
    var currentMode = 'book';

    function switchMode(mode) {
        currentMode = mode;
        var tabBook = document.getElementById('tabBook');
        var tabCancel = document.getElementById('tabCancel');
        var geoFields = document.getElementById('geoFields');
        var staffFields = document.getElementById('staffFields');
        var mainTitle = document.getElementById('mainTitle');
        var submitBtn = document.getElementById('submitBtn');
        var dateLabel = document.getElementById('dateLabel');
        var timeLabel = document.getElementById('timeLabel');
        var timeToSpan = document.getElementById('timeToSpan');
        var endTime = document.getElementById('endTime');
        
        document.getElementById('clientCity').required = (mode === 'book');
        document.getElementById('clientDistrict').required = (mode === 'book');
        document.getElementById('staffName').required = (mode === 'book');
        
        if(mode === 'book') {
            tabBook.classList.add('active');
            tabCancel.classList.remove('active');
            geoFields.style.display = 'block';
            staffFields.style.display = 'block';
            mainTitle.innerHTML = "✨ 藍寶星空清潔預約 ✨";
            dateLabel.innerHTML = "📅 預約日期 *";
            timeLabel.innerHTML = "🕒 服務時間 (單場2小時，最後進門20:00) *";
            timeToSpan.style.display = 'inline';
            endTime.style.display = 'inline';
            endTime.required = true;
            submitBtn.className = "btn-submit";
            submitBtn.innerHTML = "確認並送出預約";
            submitBtn.disabled = (document.getElementById('staffName').value === "");
        } else {
            tabBook.classList.remove('active');
            tabCancel.classList.add('active');
            geoFields.style.display = 'none';
            staffFields.style.display = 'none';
            mainTitle.innerHTML = "❌ 藍寶星空取消預約 ❌";
            dateLabel.innerHTML = "📅 欲取消的日期 *";
            timeLabel.innerHTML = "🕒 欲取消的開始時間 *";
            timeToSpan.style.display = 'none';
            endTime.style.display = 'none';
            endTime.required = false;
            submitBtn.className = "btn-submit btn-cancel-mode";
            submitBtn.innerHTML = "確認並取消預約";
            submitBtn.disabled = false;
            document.getElementById('unassignedHint').style.display = 'none';
        }
    }

    function setDateLimits() {
        var today = new Date();
        var yyyy = today.getFullYear();
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var dd = String(today.getDate()).padStart(2, '0');
        var minDateStr = yyyy + '-' + mm + '-' + dd;
        document.getElementById('bookingDate').setAttribute('min', minDateStr);
    }
    setDateLimits();

    // 監聽不指定選單提示
    document.getElementById('staffName').addEventListener('change', function() {
        var hint = document.getElementById('unassignedHint');
        if (this.value === "不指定(由公司安排)") {
            hint.style.display = 'block';
        } else {
            hint.style.display = 'none';
        }
    });

    document.getElementById('bookingDate').addEventListener('change', function() {
        if (currentMode !== 'book') return;
        var selectedDate = this.value;
        var staffSelect = document.getElementById('staffName');
        var loadingText = document.getElementById('loadingStaff');
        var submitBtn = document.getElementById('submitBtn');
        
        if(!selectedDate) return;
        
        staffSelect.innerHTML = '<option value="">-- 正在載入名單 --</option>';
        loadingText.style.display = 'inline';
        submitBtn.disabled = true;
        submitBtn.innerHTML = "請選擇服務人員";
        document.getElementById('unassignedHint').style.display = 'none';
        
        fetch(gasUrl + '?date=' + selectedDate)
        .then(res => res.json())
        .then(data => {
            loadingText.style.display = 'none';
            if(data && data.length > 0) {
                staffSelect.innerHTML = '<option value="不指定(由公司安排)">🙋‍♂️ 不指定（由公司安排）</option>';
                data.forEach(staff => {
                    var opt = document.createElement('option');
                    opt.value = staff.name;
                    opt.innerHTML = staff.name + ' (主服務：' + staff.city + ')';
                    staffSelect.appendChild(opt);
                });
                submitBtn.disabled = false;
                submitBtn.innerHTML = "確認並送出預約";
            } else {
                staffSelect.innerHTML = '<option value="">🔒 當日預約已滿，請更換日期</option>';
                alert('您選擇的日期已經預約滿了，請更換其他您方便預約的日期，感謝您！');
                submitBtn.disabled = true;
                submitBtn.innerHTML = "🔒 當日已滿，無法送出";
            }
        })
        .catch(err => {
            loadingText.style.display = 'none';
            staffSelect.innerHTML = '<option value="">連線失敗，請重試</option>';
        });
    });

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var startTime = document.getElementById('startTime').value;
        var endTime = document.getElementById('endTime').value;
        var bookingDate = document.getElementById('bookingDate').value;
        
        // 🔒 1. 24小時內禁止自主取消防呆 (僅取消模式需要)
        if (currentMode === 'cancel') {
            var now = new Date();
            var targetDateTime = new Date(bookingDate + "T" + startTime + ":00");
            
            // 計算小時落差
            var timeDiff = targetDateTime.getTime() - now.getTime();
            var hourDiff = timeDiff / (1000 * 60 * 60);
            
            if (hourDiff < 24) {
                alert("❌ 無法取消：已進入服務前 24 小時內，系統不開放線上自主取消，請改點選官方 LINE 聯絡客服由人工協助處理，感謝您！");
                location.reload();
                return;
            }
        }
        
        var startParts = startTime.split(':');
        var endParts = currentMode === 'book' ? endTime.split(':') : ['00', '00'];
        
        var startHour = parseInt(startParts, 10);
        var startMin = parseInt(startParts, 10);
        var endHour = parseInt(endParts, 10);
        var endMin = parseInt(endParts, 10);
        
        if (currentMode === 'book') {
            var startMins = startHour * 60 + startMin;
            var endMins = endHour * 60 + endMin;
            
            if (endMins <= startMins) { alert('結束時間必須大於開始時間！'); return; }
            
            var diffHours = (endMins - startMins) / 60;
            if (diffHours !== 2 && diffHours !== 4) {
                alert('提醒：單場預約為兩個小時(可預約兩場(四小時))。您目前的預約時數為 ' + diffHours + ' 小時，請重新調整！');
                return;
            }
        }
        
        var submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = currentMode === 'book' ? "⏳ 預約資料傳送中..." : "⏳ 正在處理取消請求...";
        
        var formData = {
            action: currentMode,
            clientName: document.getElementById('clientName').value,
            clientPhone: document.getElementById('clientPhone').value,
            bookingDate: bookingDate,
            startTime: startTime,
            endTime: currentMode === 'book' ? endTime : "",
            clientCity: currentMode === 'book' ? document.getElementById('clientCity').value : "",
            clientDistrict: currentMode === 'book' ? document.getElementById('clientDistrict').value : "",
            staffName: currentMode === 'book' ? document.getElementById('staffName').value : "",
            note: currentMode === 'book' ? document.getElementById('note').value : ""
        };
        
        fetch(gasUrl, {
            method: "POST",
            body: JSON.stringify(formData)
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if(data.status === "success") {
                location.reload();
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = currentMode === 'book' ? "確認並送出預約" : "確認並取消預約";
            }
        })
        .catch(err => {
            alert("連線發生錯誤，請重新再試：\n" + err);
            submitBtn.disabled = false;
            submitBtn.innerHTML = currentMode === 'book' ? "確認並送出預約" : "確認並取消預約";
        });
    });
    
    switchMode('book');
</script>
</body>
</html>
