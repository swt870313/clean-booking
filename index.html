<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藍寶星空清潔預約系統</title>
    <style>
        :root {
            --primary-color: #2a9d8f;      /* 原本的茗綠色 */
            --secondary-color: #264653;    /* 原本的青黛綠 */
            --background-color: #f4f6f8;   /* 原本的質感淺灰底 */
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .booking-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-size: 24px;
        }
        
        h4 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: #666;
            font-weight: normal;
        }

        /* 頁籤按鈕還原原本的質感設計 */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f8f9fa;
            border-radius: 6px;
            font-weight: bold;
            color: var(--secondary-color);
            transition: all 0.3s;
        }

        .tab-active {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(42, 157, 143, 0.3);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background-color: #21867a;
        }

        .note-text {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .notice-box {
            background: #fff3cd;
            color: #856404;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h2>✨ 藍寶星空清潔預約 ✨</h2>
    <h4>線上系統測試版</h4>

    <!-- 功能頁籤切換 -->
    <div class="tab-container">
        <button id="btn-book" class="tab-btn tab-active" onclick="switchTab('book')">線上預約</button>
        <button id="btn-cancel" class="tab-btn" onclick="switchTab('cancel')">取消預約</button>
    </div>

    <div class="notice-box">
        📌 <b>預約須知：</b><br>
        • 開放時間：每日 10:00 - 20:00 之間進門。<br>
        • 日期鎖定：每月 28 號起開放下個月預約。<br>
        • 時間規定：固定以 00分 或 30分 選擇。<br>
        • 取消限制：服務前 24 小時內不可線上自主取消。
    </div>

    <form id="mainForm">
        <div class="form-group">
            <label id="lbl-name">客戶姓名 (需與系統登記一致) *</label>
            <input type="text" id="clientName" required placeholder="請輸入您的姓名">
        </div>

        <div class="form-group" id="div-phone">
            <label>聯絡電話 (10位手機號碼) *</label>
            <input type="tel" id="clientPhone" placeholder="例如：0912345678" pattern="[0-9]{10}">
        </div>

        <!-- 預約專用欄位群組 -->
        <div id="booking-fields">
            <!-- 💡 質感服務項目下拉選單 -->
            <div class="form-group">
                <label>服務項目 *</label>
                <select id="serviceType" required onchange="checkServiceTime()">
                    <option value="">-- 請選擇服務項目 --</option>
                    <option value="RAINBOW除蹣服務">RAINBOW除蹣服務</option>
                    <option value="星燦高溫服務">星燦高溫服務</option>
                    <option value="除蹣+高溫 (限定預約四小時以上)">除蹣+高溫 (限定預約四小時以上)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>服務縣市 *</label>
                    <select id="clientCity">
                        <option value="">-- 請選擇縣市 --</option>
                        <option value="基隆">基隆</option><option value="台北市">台北市</option>
                        <option value="新北市">新北市</option><option value="桃園">桃園</option>
                        <option value="新竹">新竹</option><option value="苗栗">苗栗</option>
                        <option value="台中">台中</option><option value="彰化">彰化</option>
                        <option value="南投">南投</option><option value="雲林">雲林</option>
                        <option value="嘉義">嘉義</option><option value="台南">台南</option>
                        <option value="高雄">高雄</option><option value="屏東">屏東</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>預約日期 *</label>
                    <input type="date" id="bookingDate" onchange="fetchStaff()">
                </div>
            </div>

            <div class="form-group">
                <label>區 / 鄉鎮 / 細部地址 *</label>
                <input type="text" id="clientDistrict" placeholder="請輸入完整的服務地址">
            </div>

            <div class="form-group">
                <label>服務時間 *</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <select id="startTime" onchange="autoSetEndTime()">
                        <option value="">-- 開始時間 --</option>
                    </select>
                    <span style="color: var(--secondary-color); font-weight: bold;">至</span>
                    <select id="endTime" onchange="checkServiceTime()">
                        <option value="">-- 結束時間 --</option>
                    </select>
                </div>
                <div class="note-text">💡 提示：請先選開始時間，結束時間可下拉更改服務總時數。</div>
            </div>

            <div class="form-group">
                <label>指定服務人員 *</label>
                <select id="staffName">
                    <option value="不指定(由公司安排)">不指定(由公司安排)</option>
                </select>
                <div class="note-text">💡 提示：選不指定者，若需跨縣市調度，將另收 50 元車馬費。</div>
            </div>

            <div class="form-group">
                <label>特殊需求與備註 (選填)</label>
                <textarea id="note" rows="3" placeholder="例如：家中有寵物、需要加強廚房..."></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">送出預約申請</button>
    </form>
</div>
<script>
    // 🛠️ 【步驟一：貼上網址】請把下方雙引號裡面，換成你的 Google 部署網址喔！
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwh1W_XMDTUqD9xTdlORzolMwNy2Wt00cATA-ut2b1TjrKbj3m7TsX6qF6v5YjAGLfJ/exec";

    let currentAction = "book";

    // 自動產生時間下拉選單 (10:00 - 20:00)
    const startSelect = document.getElementById("startTime");
    const endSelect = document.getElementById("endTime");
    
    for(let h=10; h<=20; h++) {
        ['00', '30'].forEach(m => {
            let timeStr = `${h.toString().padStart(2,'0')}:${m}`;
            if(!(h===20 && m==='30')) {
                startSelect.options.add(new Option(timeStr, timeStr));
            }
        });
    }

    // 當客戶選了開始時間，自動產生後續的結束時間選項
    function autoSetEndTime() {
        const start = startSelect.value;
        if(!start) return;
        
        endSelect.innerHTML = '<option value="">-- 結束時間 --</option>';
        endSelect.disabled = false;

        let parts = start.split(":");
        let startHour = parseInt(parts[0], 10);
        let startMin = parseInt(parts[1], 10);
        let startTotalMins = startHour * 60 + startMin;

        for(let h=startHour; h<=22; h++) {
            ['00', '30'].forEach(m => {
                let thisTotalMins = h * 60 + parseInt(m, 10);
                if(thisTotalMins > startTotalMins) {
                    let timeStr = `${h.toString().padStart(2,'0')}:${m}`;
                    endSelect.options.add(new Option(timeStr, timeStr));
                }
            });
        }
        
        // 預設選擇 +2 小時
        let defaultEndMins = startTotalMins + 120;
        let defaultEndHour = Math.floor(defaultEndMins / 60);
        let defaultEndMin = defaultEndMins % 60 === 0 ? "00" : "30";
        let defaultEndStr = `${defaultEndHour.toString().padStart(2,'0')}:${defaultEndMin}`;
        endSelect.value = defaultEndStr;

        checkServiceTime();
    }

    // 💡 核心防呆：檢查「除蹣+高溫」有沒有滿 4 小時
    function checkServiceTime() {
        const serviceType = document.getElementById("serviceType").value;
        const start = startSelect.value;
        const end = endSelect.value;

        if (!start || !end || !serviceType) return true;

        let startParts = start.split(":");
        let endParts = end.split(":");
        let startMins = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);
        let endMins = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);
        let totalHours = (endMins - startMins) / 60;

        if (serviceType === "除蹣+高溫 (限定預約四小時以上)" && totalHours < 4) {
            alert("❌ 提示：除蹣+高溫 (限定預約四小時以上)");
            document.getElementById("serviceType").value = ""; // 清空選擇
            return false;
        }
        return true;
    }

    // 日期選擇器的 28 號規則
    const dateInput = document.getElementById("bookingDate");
    const today = new Date();
    const currentDay = today.getDate();
    dateInput.min = today.toISOString().split('T')[0];
    
    if (currentDay < 28) {
        let lastDayOfThisMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        dateInput.max = lastDayOfThisMonth.toISOString().split('T')[0];
    } else {
        let lastDayOfNextMonth = new Date(today.getFullYear(), today.getMonth() + 2, 0);
        dateInput.max = lastDayOfNextMonth.toISOString().split('T')[0];
    }

    // 切換預約或取消頁籤
    function switchTab(action) {
        currentAction = action;
        document.getElementById("btn-book").classList.toggle("tab-active", action === 'book');
        document.getElementById("btn-cancel").classList.toggle("tab-active", action === 'cancel');
        document.getElementById("booking-fields").style.display = action === 'book' ? 'block' : 'none';
        document.getElementById("submitBtn").innerText = action === 'book' ? '送出預約申請' : '確認取消此場次';
        document.getElementById("lbl-name").innerText = action === 'book' ? '客戶姓名 (需與系統登記一致) *' : '取消人姓名 (需與原預約一致) *';
        
        document.getElementById("clientPhone").required = action === 'book';
        if(action === 'cancel') {
            document.getElementById("booking-fields").querySelectorAll('input, select, textarea').forEach(el => el.required = false);
        } else {
            document.getElementById("clientCity").required = true;
            document.getElementById("clientDistrict").required = true;
            document.getElementById("bookingDate").required = true;
            document.getElementById("startTime").required = true;
            document.getElementById("serviceType").required = true;
        }
    }

    // 讀取排班人員
    function fetchStaff() {
        const date = dateInput.value;
        if(!date) return;
        const staffSelect = document.getElementById("staffName");
        staffSelect.innerHTML = '<option value="">正在讀取當日排班名單...</option>';
        
        fetch(`${GAS_WEB_APP_URL}?date=${date}`)
            .then(res => res.json())
            .then(data => {
                staffSelect.innerHTML = '<option value="不指定(由公司安排)">不指定(由公司安排)</option>';
                if(data.error) {
                    alert("讀取排班失敗: " + data.error);
                    return;
                }
                data.forEach(staff => {
                    staffSelect.options.add(new Option(`${staff.name} (${staff.city})`, staff.name));
                });
            })
            .catch(err => {
                staffSelect.innerHTML = '<option value="不指定(由公司安排)">不指定(由公司安排)(無法讀取)</option>';
                console.error(err);
            });
    }

    // 送出表單
    document.getElementById("mainForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        if(!checkServiceTime()) return;

        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "處理中，請稍後...";

        let selectedService = document.getElementById("serviceType").value;
        let userNote = document.getElementById("note").value;
        let combinedNote = `【服務項目：${selectedService}】 ` + userNote;

        let payload = {
            action: currentAction,
            clientName: document.getElementById("clientName").value,
            clientPhone: document.getElementById("clientPhone").value,
            bookingDate: document.getElementById("bookingDate").value,
            startTime: document.getElementById("startTime").value,
            endTime: document.getElementById("endTime").value,
            staffName: document.getElementById("staffName").value,
            clientCity: document.getElementById("clientCity").value,
            clientDistrict: document.getElementById("clientDistrict").value,
            note: combinedNote
        };

        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(resData => {
            alert(resData.message);
            if(resData.status === "success") {
                document.getElementById("mainForm").reset();
                if(currentAction === 'book') switchTab('book');
            }
        })
        .catch(err => {
            alert("與後端連線失敗，請確認您的部署網址是否正確！");
            console.error(err);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = currentAction === 'book' ? '送出預約申請' : '確認取消此場次';
        });
    });
</script>
</body>
</html>
